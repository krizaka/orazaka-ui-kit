# Builds and tests orazaka-ui-kit inside the Orazaka workspace (every upstream repository is
# built from source at its default branch), then publishes @krizaka/* to npm on a v* tag.
# The pipeline itself lives in krizaka/orazaka so every repository is checked the same way.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  component:
    permissions:
      contents: read
      packages: write
      id-token: write # npm trusted publishing and provenance
    uses: krizaka/orazaka/.github/workflows/component.yml@7811f56c86053a9dfd68cd871d8e7102c9b527bb # main
    with:
      component: orazaka-ui-kit
      duplication: true
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      # The root lockfile pins the formatter and its config (the design system pins an older @krizaka/config: peers stay legacy).
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: npm run format:check
