# Builds and tests orazaka-ui-kit inside the Orazaka workspace (every upstream repository is
# built from source at its default branch), then publishes @krizaka/* to npm on a v* tag.
# The pipeline itself lives in krizaka/orazaka so every repository is checked the same way.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  component:
    permissions:
      contents: read
      packages: write
      id-token: write # npm trusted publishing and provenance
    uses: krizaka/orazaka/.github/workflows/component.yml@7811f56c86053a9dfd68cd871d8e7102c9b527bb # main
    with:
      component: orazaka-ui-kit
      duplication: true
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets
